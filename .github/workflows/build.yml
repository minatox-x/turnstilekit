name: Build SDK

# Runs on every push to main/develop and on any pull request targeting main.
# Produces the AAR as a downloadable artifact (kept for 30 days).
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build AAR
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ─────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'   # Eclipse Temurin — fast, free, LTS

      # ── 3. Gradle cache ─────────────────────────────────────────────────────
      #    Cache keyed on the build files so the cache is invalidated whenever
      #    a dependency version changes.
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 4. Build ─────────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release AAR
        run: ./gradlew :turnstile-sdk:assembleRelease --no-daemon

      # ── 5. Upload ─────────────────────────────────────────────────────────────
      #    The artifact appears on the workflow run page under "Artifacts".
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4 
        with:
          name: turnstile-sdk-aar
          path: turnstile-sdk/build/outputs/aar/turnstile-sdk-release.aar
          retention-days: 30
