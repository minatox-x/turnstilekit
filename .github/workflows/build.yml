name: Build SDK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release AAR
        run: |
          chmod +x gradlew
          ./gradlew :turnstile-sdk:assembleRelease --no-daemon

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnstile-sdk-aar
          path: turnstile-sdk/build/outputs/aar/turnstile-sdk-release.aar
          retention-days: 30
