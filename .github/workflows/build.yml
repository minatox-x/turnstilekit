name: Build SDK

# Runs on every push to main/develop and on any pull request targeting main.
# No local setup required — Gradle is installed by the workflow itself.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build AAR
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle ─────────────────────────────────────────────────────────
      #    This installs Gradle 8.4 directly on the runner — no gradlew or
      #    local Gradle installation needed. It also handles all Gradle caching
      #    automatically (dependency JARs, build outputs).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # ── 4. Build ──────────────────────────────────────────────────────────
      - name: Build release AAR
        run: gradle :turnstile-sdk:assembleRelease --no-daemon

      # ── 5. Upload ─────────────────────────────────────────────────────────
      #    Artifact is available on the workflow run page for 30 days.
      #    Actions → Build SDK → (click the run) → Artifacts → turnstile-sdk-aar
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnstile-sdk-aar
          path: turnstile-sdk/build/outputs/aar/turnstile-sdk-release.aar
          retention-days: 30
