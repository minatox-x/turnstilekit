name: Build Demo APK

# Runs ONLY when triggered manually from the GitHub Actions tab.
# Go to: Actions → Build Demo APK → Run workflow → Run workflow
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build ${{ github.event.inputs.build_type }} APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ──────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle ────────────────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # ── 4. Build APK ─────────────────────────────────────────────────────────
      - name: Build debug APK
        if: github.event.inputs.build_type == 'debug'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        if: github.event.inputs.build_type == 'release'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      # ── 5. Rename APK to include build type and short SHA ────────────────────
      - name: Rename APK
        run: |
          TYPE=${{ github.event.inputs.build_type }}
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          SRC="app/build/outputs/apk/${TYPE}/app-${TYPE}.apk"
          DST="app/build/outputs/apk/${TYPE}/TurnstileKit-demo-${TYPE}-${SHA}.apk"
          mv "$SRC" "$DST"
          echo "APK_PATH=$DST" >> $GITHUB_ENV
          echo "APK_NAME=TurnstileKit-demo-${TYPE}-${SHA}.apk" >> $GITHUB_ENV

      # ── 6. Upload APK as artifact ────────────────────────────────────────────
      #    Download it from: Actions → this run → Artifacts section at the bottom
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 30
