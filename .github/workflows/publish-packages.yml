name: Publish to GitHub Packages

# This is OPTIONAL — only needed if you want consumers to pull the SDK via
# Gradle (implementation "com.github.YOU:turnstile-sdk:1.0.0") instead of
# downloading the AAR manually.
#
# Prerequisites:
#   1. Add `maven-publish` to turnstile-sdk/build.gradle.kts  (see below).
#   2. Replace YOUR_GITHUB_USERNAME and YOUR_REPO_NAME below.
#   3. Push a version tag to trigger.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish AAR to GitHub Packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # required to push to GitHub Packages

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Extract version
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Publish to GitHub Packages
        run: ./gradlew :turnstile-sdk:publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION:  ${{ steps.ver.outputs.VERSION }}

