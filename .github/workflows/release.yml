name: Release SDK

# Push a version tag to trigger this workflow:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The workflow will:
#   1. Build the AAR
#   2. Create a GitHub Release with the AAR attached
#   3. Publish the AAR to GitHub Packages (Maven)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # v1.0.0, v2.3.1, …

jobs:
  release:
    name: Build, Release & Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write    # create GitHub Releases and upload assets
      packages: write    # publish to GitHub Packages (Maven)

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle ─────────────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # ── 4. Parse version from the Git tag ─────────────────────────────────
      #    GITHUB_REF_NAME = "v1.2.3"  →  VERSION = "1.2.3"
      - name: Extract version
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── 5. Build ──────────────────────────────────────────────────────────
      - name: Build release AAR
        run: |
          chmod +x gradlew
          ./gradlew :turnstile-sdk:assembleRelease --no-daemon

      # ── 6. Rename AAR to include the version ──────────────────────────────
      #    turnstile-sdk-release.aar  →  turnstile-sdk-1.2.3.aar
      - name: Rename AAR
        run: |
          mv turnstile-sdk/build/outputs/aar/turnstile-sdk-release.aar \
             turnstile-sdk/build/outputs/aar/turnstile-sdk-${{ steps.ver.outputs.VERSION }}.aar

      # ── 7. GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "TurnstileKit $GITHUB_REF_NAME" \
            --generate-notes \
            "turnstile-sdk/build/outputs/aar/turnstile-sdk-${{ steps.ver.outputs.VERSION }}.aar"

      # ── 8. Publish to GitHub Packages (Maven) ─────────────────────────────
      - name: Publish to GitHub Packages
        run: ./gradlew :turnstile-sdk:publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION:  ${{ steps.ver.outputs.VERSION }}

      # ── 9. Also save as a workflow artifact ───────────────────────────────
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnstile-sdk-${{ steps.ver.outputs.VERSION }}
          path: turnstile-sdk/build/outputs/aar/turnstile-sdk-${{ steps.ver.outputs.VERSION }}.aar
          retention-days: 90
