name: Release SDK

# ── Automatic trigger ──────────────────────────────────────────────────────────
# Push a version tag to trigger the full release pipeline:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# ── Manual trigger ─────────────────────────────────────────────────────────────
# Go to: Actions → Release SDK → Run workflow
# Type the version (e.g. 1.2.0) — no "v" prefix needed.
# The workflow will build the AAR, create a GitHub Release, and publish to
# GitHub Packages, exactly like a tag push would.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # v1.0.0, v2.3.1, …

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0 — no "v" prefix)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: Build, Release & Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write    # create GitHub Releases and upload assets
      packages: write    # publish to GitHub Packages (Maven)

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle ─────────────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # ── 4. Resolve version ────────────────────────────────────────────────
      #    Tag push  → strip the leading "v"  (v1.2.3 → 1.2.3)
      #    Manual    → use the typed input directly
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "TAG=v${{ github.event.inputs.version }}"    >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "TAG=${GITHUB_REF_NAME}"        >> "$GITHUB_OUTPUT"
          fi

      # ── 5. Build AAR ──────────────────────────────────────────────────────
      - name: Build release AAR
        run: |
          chmod +x gradlew
          ./gradlew :turnstile-sdk:assembleRelease --no-daemon

      # ── 6. Rename AAR to include the version ──────────────────────────────
      #    turnstile-sdk-release.aar  →  turnstile-sdk-1.2.3.aar
      - name: Rename AAR
        run: |
          mv turnstile-sdk/build/outputs/aar/turnstile-sdk-release.aar \
             turnstile-sdk/build/outputs/aar/turnstile-sdk-${{ steps.ver.outputs.VERSION }}.aar

      # ── 7. GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.TAG }}" \
            --title "TurnstileKit ${{ steps.ver.outputs.TAG }}" \
            --generate-notes \
            "turnstile-sdk/build/outputs/aar/turnstile-sdk-${{ steps.ver.outputs.VERSION }}.aar"

      # ── 8. Publish to GitHub Packages (Maven) ─────────────────────────────
      - name: Publish to GitHub Packages
        run: ./gradlew :turnstile-sdk:publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION:  ${{ steps.ver.outputs.VERSION }}

      # ── 9. Also save as a workflow artifact ───────────────────────────────
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnstile-sdk-${{ steps.ver.outputs.VERSION }}
          path: turnstile-sdk/build/outputs/aar/turnstile-sdk-${{ steps.ver.outputs.VERSION }}.aar
          retention-days: 90
